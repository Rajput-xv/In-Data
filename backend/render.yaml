services:
  - type: web
    name: indata-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn indata.wsgi:application --workers 2 --bind 0.0.0.0:$PORT --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: indata-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://indata.vercel.app
      - key: ANALYST_EMAIL
        value: automation@indata.com
      - key: DATABASE_URL
        fromDatabase:
          name: indata-db
          property: connectionString

databases:
  - name: indata-db
    plan: free
    databaseName: indata
    user: indata
